<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestisci Disponibilità</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f0f2f5;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      color: #0f1724;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title { font-size: 22px; font-weight: 700; color: #0f1724; margin: 0; }
    .page-subtitle { font-size: 13px; color: #8a9aae; margin: 3px 0 0; }

    /* ── Pulsante primario ── */
    .btn-crea {
      display: inline-flex; align-items: center; gap: 7px;
      background: #1a6fce; color: #fff;
      border: none; border-radius: 9px;
      padding: 10px 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .15s;
      white-space: nowrap;
    }
    .btn-crea:hover { background: #155bb5; }
    .btn-crea-icon { font-size: 18px; line-height: 1; }

    /* ── Summary strip ── */
    .summary-strip {
      display: flex; gap: 12px; margin-bottom: 20px;
    }
    .summary-card {
      flex: 1; background: #fff; border-radius: 10px;
      padding: 14px 16px; border: 1px solid #e8eaed;
    }
    .summary-card-val { font-size: 26px; font-weight: 800; line-height: 1; }
    .summary-card-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a9aae; margin-top: 4px; }

    /* ── Tab giorni ── */
    .days-tab-bar {
      display: flex; background: #fff; border-radius: 11px 11px 0 0;
      border: 1px solid #e8eaed; border-bottom: none;
      overflow-x: auto;
    }
    .day-tab {
      flex: 1; min-width: 100px; padding: 12px 10px 10px;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .12s; text-align: center;
      position: relative;
    }
    .day-tab.active {
      border-bottom-color: #1a6fce;
      background: #f0f4ff;
    }
    .day-tab-dow {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #8a9aae;
    }
    .day-tab-date {
      font-size: 13px; font-weight: 700; color: #0f1724; margin-top: 1px;
    }
    .day-tab.active .day-tab-date { color: #1a6fce; }
    .day-tab-dots {
      display: flex; gap: 4px; justify-content: center; margin-top: 5px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; }

    /* ── Slot panel ── */
    .slot-panel {
      background: #fff; border-radius: 0 0 11px 11px;
      border: 1px solid #e8eaed; border-top: none;
      padding: 16px;
    }
    .slot-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 1px solid #f0f2f5;
    }
    .slot-panel-title { font-size: 13px; font-weight: 600; color: #4a5568; }
    .slot-count-chip {
      font-size: 11px; font-weight: 600; color: #8a9aae;
      background: #f0f2f5; border-radius: 20px; padding: 2px 10px;
    }
    .slot-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
      border: 1px solid #e8eaed; background: #f8f9fb;
      transition: border-color .12s;
    }
    .slot-row:last-child { margin-bottom: 0; }
    .slot-bar { width: 3px; height: 30px; border-radius: 2px; flex-shrink: 0; }
    .slot-time { font-size: 14px; font-weight: 700; color: #0f1724; flex: 1; font-variant-numeric: tabular-nums; }
    .slot-paziente { font-size: 12px; color: #8a9aae; }
    .slot-badge {
      font-size: 11px; font-weight: 600; border-radius: 5px;
      padding: 3px 9px;
    }
    .badge-libero { color: #16a34a; background: #f0fdf4; border: 1px solid #bbf7d0; }
    .badge-prenotato { color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,36,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: #fff; border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      width: 560px; max-width: 95vw;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ── Modal B internals ── */
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #e8eaed;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: #0f1724; margin: 0; }
    .modal-subtitle { font-size: 13px; color: #8a9aae; margin: 3px 0 0; }
    .modal-close {
      background: none; border: none; color: #8a9aae;
      font-size: 20px; cursor: pointer; line-height: 1; padding: 0;
    }
    .modal-close:hover { color: #0f1724; }
    .modal-body { padding: 20px 24px; }
    .modal-footer {
      padding: 14px 24px; border-top: 1px solid #e8eaed;
      display: flex; justify-content: flex-end; gap: 8px;
      background: #f8f9fa; border-radius: 0 0 14px 14px;
    }

    /* ── Form fields ── */
    .field-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: #6b7a8d; margin-bottom: 6px;
    }
    .field-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .field-col { flex: 1; }
    .f-input {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid #dde1e7; border-radius: 8px;
      font-size: 14px; color: #1a1f2e; background: #fff;
      transition: border-color .12s; outline: none;
      font-family: inherit;
    }
    .f-input:focus { border-color: #1a6fce; box-shadow: 0 0 0 3px rgba(26,111,206,.1); }
    .f-sep { display: flex; align-items: flex-end; padding-bottom: 10px; color: #8a9aae; font-size: 13px; }

    /* ── Day chips ── */
    .day-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .day-chip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1.5px solid #dde1e7; background: #fff; color: #4a5568;
      transition: all .12s; user-select: none;
    }
    .day-chip.selected { background: #1a6fce; border-color: #1a6fce; color: #fff; }
    .day-chip:hover:not(.selected) { border-color: #1a6fce; color: #1a6fce; }

    /* ── Pausa pranzo ── */
    .pausa-box {
      border: 1.5px solid #e8eaed; border-radius: 9px; overflow: hidden;
      transition: border-color .15s; margin-bottom: 0;
    }
    .pausa-box.active { border-color: #f59e0b; }
    .pausa-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; cursor: pointer; background: #fefce8; gap: 8px;
    }
    .pausa-toggle-label { font-size: 13px; font-weight: 600; color: #92400e; display: flex; align-items: center; gap: 6px; }
    .pausa-switch {
      width: 36px; height: 20px; border-radius: 10px;
      background: #e8eaed; position: relative; transition: background .15s; flex-shrink: 0;
    }
    .pausa-switch.on { background: #f59e0b; }
    .pausa-switch::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      transition: transform .15s;
    }
    .pausa-switch.on::after { transform: translateX(16px); }
    .pausa-fields {
      padding: 12px 14px; display: flex; gap: 10px;
      background: #fffbeb; border-top: 1px solid #fde68a;
    }
    .pausa-hint { font-size: 11px; color: #a16207; padding: 0 14px 10px; background: #fffbeb; }

    /* ── Slot preview bar ── */
    .preview-bar {
      background: #f4f6f9; border-radius: 8px; padding: 11px 14px;
      display: flex; align-items: center; gap: 10px; margin-top: 16px;
    }
    .preview-count { background: #1a6fce; color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700; }

    /* ── Success toast ── */
    .toast-wrap {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 2000; animation: toastIn .2s ease;
    }
    @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    .toast-msg {
      background: #0f1724; color: #fff;
      padding: 12px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── Mock data ── */
const MOCK_DAYS = [
  { date: '02/05', dow: 'Ven', fullDate: '02/05/2026', slots: [
    { time: '09:00 – 09:30', stato: 'libero' },
    { time: '10:00 – 10:30', stato: 'prenotato', paziente: 'M. Rossi' },
    { time: '11:00 – 11:30', stato: 'libero' },
  ]},
  { date: '05/05', dow: 'Lun', fullDate: '05/05/2026', slots: [
    { time: '09:00 – 09:30', stato: 'libero' },
    { time: '09:30 – 10:00', stato: 'libero' },
    { time: '10:00 – 10:30', stato: 'prenotato', paziente: 'F. Conti' },
  ]},
  { date: '06/05', dow: 'Mar', fullDate: '06/05/2026', slots: [
    { time: '09:00 – 09:30', stato: 'libero' },
    { time: '10:00 – 10:30', stato: 'libero' },
    { time: '11:00 – 11:30', stato: 'prenotato', paziente: 'G. Verdi' },
  ]},
  { date: '07/05', dow: 'Mer', fullDate: '07/05/2026', slots: [
    { time: '09:00 – 09:30', stato: 'libero' },
    { time: '10:00 – 10:30', stato: 'libero' },
    { time: '11:00 – 11:30', stato: 'libero' },
  ]},
  { date: '08/05', dow: 'Gio', fullDate: '08/05/2026', slots: [
    { time: '09:00 – 09:30', stato: 'prenotato', paziente: 'L. Bianchi' },
    { time: '10:00 – 10:30', stato: 'libero' },
    { time: '11:00 – 11:30', stato: 'libero' },
  ]},
  { date: '09/05', dow: 'Ven', fullDate: '09/05/2026', slots: [
    { time: '09:00 – 09:30', stato: 'libero' },
    { time: '10:00 – 10:30', stato: 'libero' },
    { time: '11:00 – 11:30', stato: 'prenotato', paziente: 'A. Ferrari' },
  ]},
];

/* ══ Pausa pranzo ══ */
function PausaPranzo({ pausaFrom, setPausaFrom, pausaTo, setPausaTo }) {
  const [on, setOn] = useState(false);
  return (
    <div className={`pausa-box${on ? ' active' : ''}`}>
      <div className="pausa-toggle" onClick={() => setOn(v => !v)}>
        <span className="pausa-toggle-label">
          <span style={{fontSize:15}}>☕</span> Pausa pranzo
        </span>
        <div className={`pausa-switch${on ? ' on' : ''}`}></div>
      </div>
      {on && (
        <>
          <div className="pausa-fields">
            <div style={{flex:1}}>
              <div className="field-label" style={{color:'#a16207'}}>Pausa inizio</div>
              <input type="time" className="f-input" value={pausaFrom} onChange={e => setPausaFrom(e.target.value)} />
            </div>
            <div className="f-sep">—</div>
            <div style={{flex:1}}>
              <div className="field-label" style={{color:'#a16207'}}>Pausa fine</div>
              <input type="time" className="f-input" value={pausaTo} onChange={e => setPausaTo(e.target.value)} />
            </div>
          </div>
          <div className="pausa-hint">Gli slot in questo intervallo verranno esclusi automaticamente.</div>
        </>
      )}
    </div>
  );
}

/* ══ Modale B ══ */
function ModaleCrea({ onClose, onCreated }) {
  const [dateFrom, setDateFrom] = useState('2026-05-12');
  const [dateTo, setDateTo]     = useState('2026-05-31');
  const [timeFrom, setTimeFrom] = useState('09:00');
  const [timeTo, setTimeTo]     = useState('12:00');
  const [pausaFrom, setPausaFrom] = useState('13:00');
  const [pausaTo, setPausaTo]     = useState('14:00');
  const [days, setDays] = useState(['LUN','MAR','MER','GIO','VEN']);

  const allDays = ['LUN','MAR','MER','GIO','VEN'];
  const toggleDay = d => setDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);

  const slotCount = 30; // mock

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-header">
          <div>
            <p className="modal-title">Crea disponibilità</p>
            <p className="modal-subtitle">Genera slot in batch per un periodo selezionato</p>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        <div className="modal-body">
          {/* Date range */}
          <div className="field-row">
            <div className="field-col">
              <div className="field-label">Dal</div>
              <input type="date" className="f-input" value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
            </div>
            <div className="f-sep">→</div>
            <div className="field-col">
              <div className="field-label">Al</div>
              <input type="date" className="f-input" value={dateTo} onChange={e => setDateTo(e.target.value)} />
            </div>
          </div>

          {/* Time range */}
          <div className="field-row">
            <div className="field-col">
              <div className="field-label">Ora inizio</div>
              <input type="time" className="f-input" value={timeFrom} onChange={e => setTimeFrom(e.target.value)} />
            </div>
            <div className="f-sep">—</div>
            <div className="field-col">
              <div className="field-label">Ora fine</div>
              <input type="time" className="f-input" value={timeTo} onChange={e => setTimeTo(e.target.value)} />
            </div>
          </div>

          {/* Days */}
          <div style={{marginBottom:16}}>
            <div className="field-label">Giorni</div>
            <div className="day-chips">
              {allDays.map(d => (
                <div key={d} className={`day-chip${days.includes(d) ? ' selected' : ''}`} onClick={() => toggleDay(d)}>{d}</div>
              ))}
            </div>
          </div>

          {/* Pausa */}
          <PausaPranzo pausaFrom={pausaFrom} setPausaFrom={setPausaFrom} pausaTo={pausaTo} setPausaTo={setPausaTo} />

          {/* Preview bar */}
          <div className="preview-bar">
            <span className="preview-count">{slotCount}</span>
            <span style={{fontSize:13,color:'#4a5568'}}>slot verranno creati · solo futuri, senza sovrapposizioni</span>
          </div>
        </div>

        <div className="modal-footer">
          <button
            style={{background:'none',border:'1.5px solid #dde1e7',borderRadius:8,padding:'8px 18px',fontSize:14,fontWeight:500,color:'#4a5568',cursor:'pointer'}}
            onClick={onClose}
          >Annulla</button>
          <button
            style={{background:'#1a6fce',border:'none',borderRadius:8,padding:'8px 22px',fontSize:14,fontWeight:600,color:'#fff',cursor:'pointer'}}
            onClick={() => { onCreated(slotCount); onClose(); }}
          >Crea slot</button>
        </div>
      </div>
    </div>
  );
}

/* ══ Lista E — Tab giorni + slot ══ */
function ListaDisponibilita({ days: initialDays }) {
  const [activeDay, setActiveDay] = useState(0);
  const [days, setDays] = useState(initialDays);

  const toggleBlocca = (di, si) => {
    setDays(prev => prev.map((d, i) => i !== di ? d : {
      ...d,
      slots: d.slots.map((s, j) => j !== si ? s : {
        ...s,
        stato: s.stato === 'libero' ? 'bloccato' : 'libero',
        paziente: undefined
      })
    }));
  };

  const totali = days.reduce((acc, d) => {
    d.slots.forEach(s => {
      if (s.stato === 'libero' || s.stato === 'prenotato') acc.slot++;
      if (s.stato === 'libero') acc.liberi++;
      if (s.stato === 'prenotato') acc.prenotati++;
    });
    return acc;
  }, { slot: 0, liberi: 0, prenotati: 0 });

  const activeSlots = (days[activeDay]?.slots || []).filter(s => s.stato !== 'bloccato');
  const activeFullDate = days[activeDay]?.fullDate || '';

  return (
    <div>
      {/* Summary strip */}
      <div className="summary-strip">
        {[
          { label: 'Slot totali', val: totali.slot, color: '#0f1724' },
          { label: 'Liberi', val: totali.liberi, color: '#16a34a' },
          { label: 'Prenotati', val: totali.prenotati, color: '#2563eb' },
        ].map(c => (
          <div key={c.label} className="summary-card">
            <div className="summary-card-val" style={{color: c.color}}>{c.val}</div>
            <div className="summary-card-lbl">{c.label}</div>
          </div>
        ))}
      </div>

      {/* Tab bar */}
      <div className="days-tab-bar">
        {days.map((d, i) => {
          const lib = d.slots.filter(s => s.stato === 'libero').length;
          const pren = d.slots.filter(s => s.stato === 'prenotato').length;
          return (
            <div
              key={i}
              className={`day-tab${activeDay === i ? ' active' : ''}`}
              onClick={() => setActiveDay(i)}
            >
              <div className="day-tab-dow">{d.dow}</div>
              <div className="day-tab-date">{d.date}</div>
              <div className="day-tab-dots">
                {lib > 0 && <span className="dot" style={{background:'#16a34a'}}></span>}
                {pren > 0 && <span className="dot" style={{background:'#2563eb'}}></span>}
              </div>
            </div>
          );
        })}
      </div>

      {/* Slot panel */}
      <div className="slot-panel">
        <div className="slot-panel-header">
          <span className="slot-panel-title">{activeFullDate}</span>
          <span className="slot-count-chip">{activeSlots.length} slot</span>
        </div>
        {activeSlots.length === 0 && (
          <p style={{color:'#8a9aae',fontSize:13,textAlign:'center',padding:'24px 0',margin:0}}>Nessuno slot per questo giorno.</p>
        )}
        {activeSlots.map((s, i) => {
          const realIdx = days[activeDay].slots.indexOf(s);
          return (
            <div key={i} className="slot-row">
              <div className="slot-bar" style={{background: s.stato === 'libero' ? '#16a34a' : '#2563eb'}}></div>
              <span className="slot-time">{s.time}</span>
              {s.paziente && <span className="slot-paziente">{s.paziente}</span>}
              <span className={`slot-badge ${s.stato === 'libero' ? 'badge-libero' : 'badge-prenotato'}`}>
                {s.stato === 'libero' ? 'Libero' : 'Prenotato'}
              </span>
              {s.stato === 'libero' && (
                <button
                  onClick={() => toggleBlocca(activeDay, realIdx)}
                  style={{fontSize:11,fontWeight:600,color:'#64748b',background:'#f1f5f9',border:'1px solid #e2e8f0',borderRadius:6,padding:'4px 12px',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}
                >Blocca</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══ App ══ */
function App() {
  const [modale, setModale] = useState(false);
  const [toast, setToast] = useState(null);
  const [days, setDays] = useState(MOCK_DAYS);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const handleCreated = (count) => {
    showToast(`✓ ${count} slot creati con successo`);
  };

  return (
    <div className="page-wrap">
      {/* Page header */}
      <div className="page-header">
        <div>
          <h1 className="page-title">Gestisci disponibilità</h1>
          <p className="page-subtitle">Crea e controlla gli slot per le visite</p>
        </div>
        <button className="btn-crea" onClick={() => setModale(true)}>
          <span className="btn-crea-icon">+</span>
          Crea disponibilità
        </button>
      </div>

      {/* Lista */}
      <ListaDisponibilita days={days} />

      {/* Modale */}
      {modale && (
        <ModaleCrea onClose={() => setModale(false)} onCreated={handleCreated} />
      )}

      {/* Toast */}
      {toast && (
        <div className="toast-wrap">
          <div className="toast-msg">{toast}</div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<div id="root"></div>
</body>
</html>
