services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prenoting}
      MYSQL_USER: ${DB_USERNAME:-prenoting}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prenoting_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-prenoting}", "-p${DB_PASSWORD:-prenoting_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    environment:
      APP_NAME: MedPortal
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:Ue5VazY5hl2xwRlG/2xb89ihyWhH/NBcwH8Q4VlQx2I=}
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:${APP_HOST_PORT:-8080}
      APP_TIMEZONE: Europe/Rome
      APP_LOCALE: it
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-prenoting}
      DB_USERNAME: ${DB_USERNAME:-prenoting}
      DB_PASSWORD: ${DB_PASSWORD:-prenoting_password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - laravel_node_modules:/var/www/html/node_modules

volumes:
  mysql_data:
  laravel_vendor:
  laravel_node_modules:
